<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Lesson ' + ${lesson.id} + ': ' + ${lesson.title} + ' | Kitsuno'"></title>

    <link rel="icon" href="/images/favicon/favicon-32x32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/images/favicon/favicon-64x64.png" sizes="64x64" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Poppins:ital,wght@0,100;0,400;0,500;0,600;1,400;1,500;1,600&family=Quicksand:wght@300..700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav class="navbar">
    <div class="logo">
        <a href="/">
            <img th:src="@{/images/navbar/logo.png}" alt="Logo">
        </a>
    </div>
    <ul class="nav-links">
        <li><a href="/vocabulary"><img th:src="@{/images/navbar/vocabulary_icon.png}" alt="Vocabulary Icon">
            <span>Vocabulary</span></a>
        </li>
        <li><a href="/hiragana"><img th:src="@{/images/navbar/hiragana_icon.png}" alt="Hiragana Icon">
            <span>Hiragana</span></a></li>
        <li><a href="/katakana"><img th:src="@{/images/navbar/katakana_icon.png}" alt="Katakana Icon">
            <span>Katakana</span></a></li>
        <li><a href="/kanji"><img th:src="@{/images/navbar/kanji_icon.png}" alt="Kanji Icon">
            <span>Kanji</span></a></li>
        <li><a href="/flashcards"><img th:src="@{/images/navbar/flashcard_icon.png}" alt="Flashcards Icon">
            <span>Flashcards</span></a></li>
        <li class="active"><a href="/grammar"><img th:src="@{/images/navbar/particle_icon.png}" alt="Grammar Icon">
            <span>Grammar</span></a></li>
    </ul>
    <div class="user-section">
        <a href="#" class="user-link">
            <h6 sec:authorize="isAuthenticated()">Hi <span sec:authentication="name">!</span></h6>
            <h6 sec:authorize="!isAuthenticated()">Hi Guest!</h6>
            <img th:src="@{/images/navbar/user_icon.png}" alt="User Icon" class="user-icon">
        </a>
        <ul class="user-dropdown">
            <li sec:authorize="!isAuthenticated()">
                <a href="/login"><img th:src="@{/images/navbar/login.png}" alt="Login Icon"> LogIn</a>
            </li>
            <li sec:authorize="!isAuthenticated()">
                <a href="/register"><img th:src="@{/images/navbar/register.png}" alt="Register Icon"> Register</a>
            </li>
            <li sec:authorize="isAuthenticated()">
                <a href="/profile"><img th:src="@{/images/navbar/profile.png}" alt="Profile Icon"> Profile</a>
            </li>
            <li sec:authorize="isAuthenticated()">
                <a href="/logout"><img th:src="@{/images/navbar/logout.png}" alt="Logout Icon"> Logout</a>
            </li>
            <li>
                <a href="/v1/api-docs"><img th:src="@{/images/navbar/api.png}" alt="Api-Docs Icon"> ApiDocs</a>
            </li>
        </ul>
    </div>
</nav>

<nav class="bottom-navbar">
    <ul class="nav-links">
        <li><a href="/vocabulary"><img th:src="@{/images/navbar/vocabulary_icon.png}" alt="Vocabulary Icon">
            <span>Vocabulary</span></a>
        </li>
        <li><a href="/hiragana"><img th:src="@{/images/navbar/hiragana_icon.png}" alt="Hiragana Icon">
            <span>Hiragana</span></a></li>
        <li><a href="/katakana"><img th:src="@{/images/navbar/katakana_icon.png}" alt="Katakana Icon">
            <span>Katakana</span></a></li>
        <li><a href="/kanji"><img th:src="@{/images/navbar/kanji_icon.png}" alt="Kanji Icon">
            <span>Kanji</span></a></li>
        <li><a href="/flashcards"><img th:src="@{/images/navbar/flashcard_icon.png}" alt="Flashcards Icon">
            <span>Flashcards</span></a></li>
        <li class="active"><a href="/grammar"><img th:src="@{/images/navbar/particle_icon.png}" alt="Grammar Icon">
            <span>Grammar</span></a></li>
    </ul>
</nav>

<div id="main-section">
    <a href="/grammar" class="back-button"><img th:src="@{/images/kanji/arrow.png}" alt="Back to lessons"></a>

    <div class="lesson-header">
        <span class="lesson-badge" th:text="'Lesson ' + ${lesson.id}"></span>
        <h1 th:text="${lesson.title}"></h1>
    </div>

    <div class="lesson-content" th:utext="${lesson.content}"></div>

    <div class="lesson-nav">
        <a th:if="${prevLesson != null}" class="flashcard-button"
           th:href="@{/grammar/{id}(id=${prevLesson.id})}">&larr; Previous</a>
        <span th:if="${prevLesson == null}"></span>

        <a th:if="${nextLesson != null}" class="flashcard-button"
           th:href="@{/grammar/{id}(id=${nextLesson.id})}">Next &rarr;</a>
        <a th:if="${nextLesson == null}" class="flashcard-button" th:href="@{/grammar}">All lessons</a>
    </div>
</div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
